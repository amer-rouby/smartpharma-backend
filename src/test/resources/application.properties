# Test-only configuration. Not shipped in the application artifact, so it's fine for
# this to hold a throwaway local Postgres connection - point it at your own local
# database, same as the app previously assumed by default.
# Note: this file fully replaces (not merges with) src/main/resources/application.properties
# on the test classpath, so it repeats the non-secret settings that tests still need.
spring.datasource.url=jdbc:postgresql://localhost:5432/smartpharma
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
# Must be valid standard Base64 (JwtService base64-decodes it directly as key bytes) -
# a plain human-readable string with hyphens/etc breaks the very first real login a
# test performs, which is exactly what exposed this (AuthenticationServiceImplIntegrationTest
# was the first test to ever call the real login path and actually generate a JWT).
jwt.secret=U21hcnRQaGFybWFUZXN0T25seVNlY3JldEtleU5vdFVzZWRBbnl3aGVyZUVsc2UxMjM0NTY3ODkw
jwt.expiration=86400000
jwt.refresh-expiration=604800000

spring.jpa.properties.hibernate.default_schema=smartpharma
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
app.upload-dir=${user.dir}/uploads/profiles/
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:8080
platform.admin-api-key=test-only-platform-key-not-used-anywhere-else
