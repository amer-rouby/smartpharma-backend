# Test-only configuration. Not shipped in the application artifact, so it's fine for
# this to hold a throwaway local Postgres connection - point it at your own local
# database, same as the app previously assumed by default.
# Note: this file fully replaces (not merges with) src/main/resources/application.properties
# on the test classpath, so it repeats the non-secret settings that tests still need.
spring.datasource.url=jdbc:postgresql://localhost:5432/employess
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
jwt.secret=test-only-secret-not-used-anywhere-else-1234567890abcdef
jwt.expiration=86400000
jwt.refresh-expiration=604800000

spring.jpa.properties.hibernate.default_schema=smartpharma
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
app.upload-dir=${user.dir}/uploads/profiles/
