spring.application.name=smartpharma-backend
server.port=8081
spring.jpa.properties.hibernate.default_schema=smartpharma
spring.datasource.url=jdbc:postgresql://localhost:5432/employess
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=SmartPharmaPool
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.isolate-internal-queries=true
spring.datasource.hikari.register-mbeans=true
jwt.secret=ThisIsAVeryLongSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForSecurity
jwt.expiration=86400000
jwt.refresh-expiration=604800000
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
logging.level.com.smartpharma=DEBUG
logging.level.org.springframework.security=WARN
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${user.dir}/uploads/profiles/

# WhatsApp Cloud API Configuration
# Get these from Meta Developer Portal: https://developers.facebook.com/
whatsapp.api.base-url=https://graph.facebook.com/v18.0
whatsapp.api.phone-number-id=1262087866981818
