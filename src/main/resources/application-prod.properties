# Production overrides.
# DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, WHATSAPP_PHONE_NUMBER_ID and
# WHATSAPP_ACCESS_TOKEN must be set as real environment variables in the deployment
# environment (container/host secrets manager) - there are no defaults here on purpose,
# so the app fails fast at startup instead of silently running with dev-only settings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.com.smartpharma=INFO
logging.level.org.springframework.security=WARN
